<script>
// Ashby renders client-side: the fields appear after the page has loaded. The group
// ids change on every load. ?delay=N changes the render delay for the QA script.
const delay = Number(new URLSearchParams(location.search).get("delay") ?? 300);
window.__submitAttempts = 0;
document.querySelector(".ashby-application-form-submit-button").addEventListener("click", () => { window.__submitAttempts++; });
setTimeout(() => {
  const group = crypto.randomUUID();
  document.querySelector(".ashby-application-form-submit-button").insertAdjacentHTML("beforebegin", document.getElementById("form-template").innerHTML.replaceAll("GROUP_", group + "_"));
  // Mimic a React-controlled input: the "state" copy of the value is restored on
  // re-render unless an input event updated it first (React also keeps a value tracker).
  window.rerender = () => {};
  for (const id of ["_systemfield_name", "_systemfield_email"]) {
    const input = document.getElementById(id);
    let state = "";
    input._valueTracker = { getValue: () => state, setValue: value => { state = value; }, stopTracking() {} };
    input.addEventListener("input", () => { state = input.value; });
    const previous = window.rerender;
    window.rerender = () => { previous(); Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value").set.call(input, state); };
  }
}, delay);
</script>
